<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <filter id="rough-edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="#2B2B2B" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FAFAFA" />

  <style>
    .title { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif; font-weight: bold; font-size: 22px; fill: #2B2B2B; }
    .subtitle { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; font-size: 15px; fill: #555555; font-style: italic; }
    .label { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; font-size: 13px; fill: #2B2B2B; font-weight: bold; }
    .address { font-family: Courier, monospace; font-size: 11px; fill: #777777; }
    .caption { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; font-size: 12px; fill: #666666; }
    .pro-con { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; font-size: 13px; fill: #2B2B2B; }
    .sketch { stroke: #2B2B2B; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text x="400" y="35" text-anchor="middle" class="title">How Arrays &amp; Linked Lists Look in Memory</text>
  <line x1="150" y1="45" x2="650" y2="43" class="sketch" style="stroke-width: 1.5; stroke: #888;" />

  <g transform="translate(40, 60)">
    <text x="10" y="30" class="title" style="font-size: 18px;">1. Array <tspan class="subtitle">(Contiguous Memory)</tspan></text>
    <text x="10" y="50" class="caption">Like a group of friends sitting together at a movie theater. All seats must be next to each other.</text>
    
    <g filter="url(#rough-edge)">
      <rect x="10" y="70" width="60" height="50" class="sketch" style="stroke: #CCCCCC; stroke-dasharray: 4,4;" />
      <text x="40" y="62" text-anchor="middle" class="address">0x00</text>
      
      <rect x="70" y="70" width="80" height="50" class="sketch" style="fill: #E3F2FD; stroke-width: 2.5;" />
      <text x="110" y="100" text-anchor="middle" class="label">Data (0)</text>
      <text x="110" y="62" text-anchor="middle" class="address">0x04</text>
      <text x="110" y="138" text-anchor="middle" class="caption" style="fill: #1565C0; font-weight: bold;">Index [0]</text>

      <rect x="150" y="69" width="80" height="51" class="sketch" style="fill: #E3F2FD; stroke-width: 2.5;" />
      <text x="190" y="100" text-anchor="middle" class="label">Data (1)</text>
      <text x="190" y="62" text-anchor="middle" class="address">0x08</text>
      <text x="190" y="138" text-anchor="middle" class="caption" style="fill: #1565C0; font-weight: bold;">Index [1]</text>

      <rect x="230" y="71" width="80" height="49" class="sketch" style="fill: #E3F2FD; stroke-width: 2.5;" />
      <text x="270" y="100" text-anchor="middle" class="label">Data (2)</text>
      <text x="270" y="62" text-anchor="middle" class="address">0x0C</text>
      <text x="270" y="138" text-anchor="middle" class="caption" style="fill: #1565C0; font-weight: bold;">Index [2]</text>

      <rect x="310" y="70" width="80" height="50" class="sketch" style="fill: #E3F2FD; stroke-width: 2.5;" />
      <text x="350" y="100" text-anchor="middle" class="label">Data (3)</text>
      <text x="350" y="62" text-anchor="middle" class="address">0x10</text>
      <text x="350" y="138" text-anchor="middle" class="caption" style="fill: #1565C0; font-weight: bold;">Index [3]</text>

      <rect x="390" y="70" width="60" height="50" class="sketch" style="stroke: #CCCCCC; stroke-dasharray: 4,4;" />
      <text x="420" y="62" text-anchor="middle" class="address">0x14</text>
    </g>

    <g transform="translate(480, 65)">
      <path d="M 0,0 L 230,2 L 225,95 L -5,90 Z" class="sketch" style="fill: #FFFDE7; stroke: #FFD54F;" filter="url(#rough-edge)" />
      <text x="15" y="25" class="pro-con" style="font-weight: bold; fill: #2E7D32;">✔ Fast Lookups (O(1))</text>
      <text x="25" y="42" class="caption">You know exactly where Index [3] is instantly.</text>
      <text x="15" y="65" class="pro-con" style="font-weight: bold; fill: #C62828;">✘ Hard to Resize (O(n))</text>
      <text x="25" y="82" class="caption">If you want to add item #5, you must move all.</text>
    </g>
  </g>

  <line x1="50" y1="230" x2="750" y2="232" class="sketch" style="stroke-dasharray: 6,6; stroke: #BDBDBD;" />

  <g transform="translate(40, 250)">
    <text x="10" y="30" class="title" style="font-size: 18px;">2. Linked List <tspan class="subtitle">(Scattered/Random Memory)</tspan></text>
    <text x="10" y="50" class="caption">Like a treasure hunt. Each item is hidden anywhere in memory, but contains a map pointing to the next item.</text>

    <g filter="url(#rough-edge)">
      
      <g transform="translate(20, 90)">
        <rect x="0" y="0" width="110" height="50" rx="8" class="sketch" style="fill: #E8F5E9; stroke: #4CAF50; stroke-width: 2.2;" />
        <line x1="65" y1="0" x2="65" y2="50" class="sketch" style="stroke: #4CAF50;" />
        <text x="32" y="30" text-anchor="middle" class="label">Data A</text>
        <text x="87" y="30" text-anchor="middle" class="address" style="fill: #4CAF50; font-weight: bold;">0x9F</text>
        <text x="55" y="-10" text-anchor="middle" class="address" style="fill: #2E7D32;">Addr: 0x12</text>
        <text x="32" y="65" text-anchor="middle" class="caption" style="fill: #2E7D32; font-weight: bold;">[ HEAD ]</text>
      </g>

      <g transform="translate(240, 150)">
        <rect x="0" y="0" width="110" height="50" rx="8" class="sketch" style="fill: #E8F5E9; stroke: #4CAF50; stroke-width: 2.2;" />
        <line x1="65" y1="0" x2="65" y2="50" class="sketch" style="stroke: #4CAF50;" />
        <text x="32" y="30" text-anchor="middle" class="label">Data B</text>
        <text x="87" y="30" text-anchor="middle" class="address" style="fill: #4CAF50; font-weight: bold;">0x44</text>
        <text x="55" y="-10" text-anchor="middle" class="address" style="fill: #2E7D32;">Addr: 0x9F</text>
      </g>

      <g transform="translate(450, 70)">
        <rect x="0" y="0" width="110" height="50" rx="8" class="sketch" style="fill: #E8F5E9; stroke: #4CAF50; stroke-width: 2.2;" />
        <line x1="65" y1="0" x2="65" y2="50" class="sketch" style="stroke: #4CAF50;" />
        <text x="32" y="30" text-anchor="middle" class="label">Data C</text>
        <text x="87" y="30" text-anchor="middle" class="address" style="fill: #1565C0; font-weight: bold;">NULL</text>
        <text x="55" y="-10" text-anchor="middle" class="address" style="fill: #2E7D32;">Addr: 0x44</text>
        <text x="87" y="65" text-anchor="middle" class="caption" style="fill: #C62828; font-weight: bold;">(Tail End)</text>
      </g>

      <g transform="translate(210, 65)" style="opacity: 0.4;">
        <rect x="0" y="0" width="90" height="40" rx="4" class="sketch" style="fill: #ECEFF1; stroke: #90A4AE;" />
        <text x="45" y="24" text-anchor="middle" class="caption">Other App Data</text>
        <text x="45" y="-6" text-anchor="middle" class="address">Addr: 0x33</text>
      </g>
      <g transform="translate(420, 165)" style="opacity: 0.4;">
        <rect x="0" y="0" width="100" height="40" rx="4" class="sketch" style="fill: #ECEFF1; stroke: #90A4AE;" />
        <text x="50" y="24" text-anchor="middle" class="caption">Chrome Browser</text>
        <text x="50" y="-6" text-anchor="middle" class="address">Addr: 0x72</text>
      </g>

    </g> <path d="M 125,115 C 180,115 170,180 232,175" class="sketch" style="fill:none; stroke-width: 2; marker-end: url(#arrow);" />
    <text x="180" y="135" class="caption" style="fill: #4CAF50; font-size: 11px;">points to 0x9F</text>

    <path d="M 345,175 C 410,175 390,95 442,95" class="sketch" style="fill:none; stroke-width: 2; marker-end: url(#arrow);" />
    <text x="390" y="125" class="caption" style="fill: #4CAF50; font-size: 11px;">points to 0x44</text>

    <g transform="translate(580, 85)">
      <path d="M 0,0 L 190,-5 L 185,110 L -5,105 Z" class="sketch" style="fill: #FFFDE7; stroke: #FFD54F;" filter="url(#rough-edge)" />
      <text x="15" y="25" class="pro-con" style="font-weight: bold; fill: #2E7D32;">✔ Fast Inserts (O(1))</text>
      <text x="25" y="42" class="caption">Just drop it anywhere and</text>
      <text x="25" y="56" class="caption">change a single pointer.</text>
      <text x="15" y="80" class="pro-con" style="font-weight: bold; fill: #C62828;">✘ Slow Lookups (O(n))</text>
      <text x="25" y="97" class="caption">Must read from A → B → C.</text>
    </g>

  </g>
  
</svg>
